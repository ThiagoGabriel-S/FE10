<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookies</title>
    <style>
        :root {
            --bg: #f6f7f9;
            --card: #ffffff;
            --text: #222;
            --muted: #666;
            --accent: #5b4bdb;
            --border: #e2e4e9;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 2rem 1rem;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
        }

        main {
            max-width: 700px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 1rem;
            font-size: 1.6rem;
        }

        ol {
            margin: 0;
            padding: 1rem 1.25rem 1rem 2.6rem;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        li {
            margin: 0;
            padding: 0.6rem 0;
            border-bottom: 1px solid var(--border);
        }

        li:last-child {
            border-bottom: none;
        }

        li::marker {
            color: var(--accent);
            font-weight: 600;
        }

        a {
            color: var(--accent);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <main>
        <h1>Atividades - Aula 10</h1>

        <ol>
            <li><a href="cookies.html">Projeto sobre Cookies</a></li>
            <li><a href="bugs/bug1/bug1.html">Bug 1 resolvido</a></li>
            <li><a href="bugs/bug2/bug2.html">Bug 2 resolvido</a></li>
            <li><a href="bugs/bug3/bug3.html">Bug 3 resolvido</a></li>
        </ol>
    </main>
</body>
</html>
